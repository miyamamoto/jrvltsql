name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,postgres]"

    - name: Validate fail-closed test gate
      run: python scripts/validate_test_gate.py

    - name: Run tests
      run: |
        pytest tests \
          --ignore=tests/integration \
          --ignore=tests/e2e \
          -m "not slow" \
          -v --cov=src --cov-report=xml --cov-report=term

    - name: Verify distribution contents
      run: |
        python -m build --outdir "$RUNNER_TEMP/jltsql-dist"
        python scripts/check_distribution_contents.py "$RUNNER_TEMP"/jltsql-dist/*

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  windows-batch-syntax:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up 32-bit Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x86'

    - name: Install test dependency
      run: python -m pip install pytest

    - name: Exercise Windows launcher contracts
      run: >-
        pytest tests/test_windows_launchers.py -v
        -o addopts="--strict-markers --strict-config"

  performance-test:
    runs-on: ubuntu-latest
    # Only run performance tests on main branch or when manually triggered
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run performance benchmarks
      run: |
        pytest tests/test_performance_benchmarks.py -v --benchmark-only

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy

    - name: Fatal syntax and undefined-name lint
      run: >-
        flake8 src tests scripts/validate_test_gate.py
        --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Advisory style debt report
      run: >-
        flake8 src tests scripts/validate_test_gate.py
        --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Advisory type debt report
      run: |
        mypy src --ignore-missing-imports --no-strict-optional
      continue-on-error: true
