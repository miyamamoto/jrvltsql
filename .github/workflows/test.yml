name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,postgres]"

    - name: Run tests
      run: |
        pytest \
          tests/test_parsers.py \
          tests/test_parser.py \
          tests/test_comprehensive_integration.py \
          tests/test_realtime.py \
          tests/test_error_scenarios.py \
          tests/test_jvd_self_repair.py \
          tests/test_cache_manager.py \
          tests/test_historical_cache_failures.py \
          tests/test_batch_processor.py \
          tests/test_time_series.py \
          tests/test_distribution_contents.py \
          tests/test_retired_data_specs.py \
          tests/test_jvlink_transport_contract.py \
          tests/test_quickstart_cli.py \
          tests/unit/test_jvlink_bridge.py \
          -v --cov=src --cov-report=xml --cov-report=term

    - name: Verify distribution contents
      run: |
        python -m build --outdir "$RUNNER_TEMP/jltsql-dist"
        python scripts/check_distribution_contents.py "$RUNNER_TEMP"/jltsql-dist/*

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  windows-batch-syntax:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up 32-bit Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: 'x86'

    - name: Install test dependency
      run: python -m pip install pytest

    - name: Exercise Windows launcher contracts
      run: pytest tests/test_windows_launchers.py -v -o addopts=

  performance-test:
    runs-on: ubuntu-latest
    # Only run performance tests on main branch or when manually triggered
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run performance benchmarks
      run: |
        pytest tests/test_performance_benchmarks.py -v --benchmark-only

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy src --ignore-missing-imports --no-strict-optional
      continue-on-error: true
