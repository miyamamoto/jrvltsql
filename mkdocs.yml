site_name: JRVLTSQL ドキュメント
site_description: JRA-VAN DataLab データを SQLite/PostgreSQL に取り込むツール (Windows / Linux+Docker)
site_author: JRVLTSQL コントリビューター
site_url: https://miyamamoto.github.io/jrvltsql/

repo_name: miyamamoto/jrvltsql
repo_url: https://github.com/miyamamoto/jrvltsql

theme:
  name: material
  language: ja

plugins:
  - search:
      lang: ja

markdown_extensions:
  - tables
  - toc:
      permalink: true

validation:
  links:
    anchors: warn

nav:
  - ホーム: index.md
  - はじめに: getting_started.md
  - 時系列オッズ: timeseries_odds.md
  - PostgreSQL: postgresql.md
  - 対応データ種別一覧: data_support.md
  - CLI: CLI.md
  - Wine/Docker: wine_docker.md
  - JV-Link 手動登録: jvlink_manual_registration.md
  - スクリプト一覧: scripts.md
  - 取得サマリ JSON: fetch_summary.md
  - 速報の取得ログ: capture_log.md
  - アーキテクチャ: architecture.md
  - リリース運用方針: release_policy.md

copyright: Copyright &copy; 2024 JRVLTSQL コントリビューター
